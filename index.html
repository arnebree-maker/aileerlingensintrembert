<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-cursus 3e graad | Sint-Rembert</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="huisstijl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--blauw:#06038D;--groen:#95D600;--wit:#FFFFFF;--grijs:#D9D9D9;--licht:#CCFF99;--mid:#A6F04A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--blauw);color:var(--wit);font-family:Poppins,system-ui,"Segoe UI",sans-serif;line-height:1.5}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--groen);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:1.25rem 1.1rem 4rem}
header{display:flex;align-items:center;gap:.9rem;margin-bottom:1.25rem}
header img{width:48px;height:auto}
header h1{margin:0;font-weight:800;text-transform:uppercase;font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.1}
header p{margin:.1rem 0 0;font-weight:500;opacity:.9;font-size:.95rem}
.chev{margin-left:auto;width:64px;flex:none}
h2{font-weight:800;text-transform:uppercase;font-size:clamp(1.25rem,3.4vw,1.6rem);line-height:1.2;margin:.4rem 0 .8rem}
h3{font-weight:800;margin:0 0 .4rem;font-size:1.08rem}
p{margin:.3rem 0}
.kaart{background:var(--wit);color:var(--blauw);border-radius:28px;padding:1.25rem 1.35rem;margin-bottom:1rem}
.kaart.groen{background:var(--groen)}
.kaart.niet{background:var(--blauw);color:var(--wit);border:3px solid var(--wit)}
.kaart.twijfel{border:6px solid var(--groen)}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.hoofd,.tweede{cursor:pointer;border-radius:999px;font-weight:800;padding:.75rem 1.4rem;border:2px solid var(--groen);background:var(--groen);color:var(--blauw)}
.hoofd:hover{background:var(--mid);border-color:var(--mid)}
.hoofd:disabled{opacity:.45;cursor:not-allowed}
/* stappen van de leerlingensite */
#inhoud .mc-content{margin:0 0 1rem!important;width:100%!important;max-width:none!important}
details.video-optie{background:#F4F6FF;border:2px solid #D9D9D9;border-radius:18px;margin:14px 0;padding:0}
details.video-optie>summary{cursor:pointer;list-style:none;padding:.75rem 1rem;font-weight:700;color:#06038D}
details.video-optie>summary::-webkit-details-marker{display:none}
details.video-optie[open]>summary{border-bottom:2px solid #D9D9D9}
details.video-optie .yt-wrap{margin:0!important}
header{margin-bottom:1.25rem}
.kaart ul,.kaart ol,.lk ol,.lk ul{padding-left:1.2rem}
/* klasversie */
.kaart.bord{padding:1.6rem 1.7rem}
.kaart.bord .kern{font-size:clamp(1.25rem,2.8vw,1.75rem);font-weight:800;line-height:1.3;margin:0 0 .8rem}
.kaart.bord ul{font-size:clamp(1.02rem,2vw,1.2rem);line-height:1.6;margin:0}
.kaart.bord li{margin:.35rem 0}
.ddw{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}
.ddw span{background:#06038D;color:#FFFFFF;border-radius:999px;padding:.2rem .8rem;font-weight:800;font-size:.85rem}
.ddw span:nth-child(2){background:#95D600;color:#06038D}
.bordvraag{font-size:clamp(1.1rem,2.4vw,1.4rem);font-weight:800;line-height:1.35;margin:.2rem 0 .5rem}
.lk .antw li{opacity:.95}
/* live */
.livebalk{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;background:#FFFFFF;color:#06038D;border:4px solid #95D600;border-radius:20px;padding:.6rem 1rem;margin:0 0 .8rem}
.livebalk .tweede{border-color:#06038D;color:#06038D;padding:.4rem .9rem}
.lb-punt{width:12px;height:12px;border-radius:50%;background:#95D600;box-shadow:0 0 0 4px #CCFF99!important;animation:lbp 1.6s infinite}
@keyframes lbp{50%{opacity:.35}}
.lb-status{font-weight:700}
.lb-namen summary{cursor:pointer;font-weight:700;text-decoration:underline}
.lb-naam{display:inline-block;border:2px solid #D9D9D9;border-radius:999px;padding:.1rem .6rem;margin:.15rem;opacity:.55}
.lb-naam.aan{border-color:#95D600;opacity:1}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.7rem;margin-top:.6rem}
.lb-kaart{cursor:pointer;display:flex;flex-direction:column;gap:.2rem;text-align:left;background:#FFFFFF;border:2px solid #D9D9D9;border-radius:16px;padding:.5rem;color:#06038D;font:inherit}
.lb-kaart:hover{border-color:#95D600}
.lb-kaart img{width:100%;border-radius:10px;background:#EEF1FF}
.lb-kaart span{font-size:.85rem}
/* geleide presentatie */
body.pres-modus{overflow:hidden}
.pres{position:fixed;inset:0;z-index:40;background:#06038D;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.pres-top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.6rem 1rem;border-bottom:2px solid rgba(255,255,255,.18)}
.pres-top .stap{margin-left:auto;font-weight:700}
.pk{cursor:pointer;font:inherit;font-weight:700;border-radius:999px;border:2px solid #FFFFFF;background:transparent;color:#FFFFFF;padding:.35rem .9rem}
.pk:hover{border-color:#95D600;color:#95D600}
.pk:disabled{opacity:.35;cursor:default}
.pk.groot{width:56px;height:56px;padding:0;font-size:1.3rem;flex:none}
.pres-body{flex:1;display:flex;min-height:0}
.pres-dia{flex:1;overflow:auto;padding:1.4rem clamp(1rem,4vw,3rem)}
.pres-inhoud{max-width:1150px;margin:0 auto;font-size:clamp(1rem,1.25vw,1.3rem)}
.pres-inhoud h2{font-size:clamp(1.5rem,2.6vw,2.4rem)}
.pres-notes{display:none;width:min(380px,36vw);overflow:auto;background:#FFFFFF;color:#06038D;padding:1rem 1.1rem;border-left:6px solid #95D600}
.pres-notes.open{display:block}
.pres-notes ol,.pres-notes ul{padding-left:1.2rem}
.pres-notes .tweede{border-color:#06038D;color:#06038D}
.pres-nav{display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;border-top:2px solid rgba(255,255,255,.18)}
.pres-nav .voortgang{flex:1;margin:0}
.titeldia{text-align:left;padding-top:4vh}
.titeldia h1{font-weight:800;text-transform:uppercase;font-size:clamp(2rem,5vw,4rem);line-height:1.05;margin:.6rem 0 .3rem}
.titeldia .sub{font-size:1.2em;font-weight:600;margin:0 0 1.2rem}
/* cijfers */
.cijfers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem;margin-bottom:1rem}
.cijfer{background:#FFFFFF;color:#06038D;border-radius:24px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.2rem}
.cijfer b{font-size:clamp(2rem,4vw,3rem);font-weight:800;line-height:1}
.cijfer.groen{background:#95D600}
.cijfer.niet{background:#06038D;color:#FFFFFF;border:3px solid #FFFFFF}
.bron{font-size:.8rem;opacity:.85;margin-top:.6rem}
.balken{display:grid;gap:.6rem;margin:.6rem 0}
.balk{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:.2rem .7rem;align-items:center}
.balk .bl{grid-row:span 2;font-weight:700;font-size:.92rem}
.bw{display:flex;align-items:center;gap:.4rem}
.bw i{display:block;height:14px;border-radius:7px;background:#06038D}
.bw i.b2{background:#95D600}
.bw em{font-style:normal;font-weight:700;font-size:.85rem}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle}
.lg.l1{background:#06038D}.lg.l2{background:#95D600}
.vermeld-kader{border-radius:24px;overflow:hidden;border:3px solid #95D600;background:#06038D;margin-bottom:.8rem}
.vermeld-kader iframe{display:block;width:100%;height:min(1050px,82vh);border:0}
/* oefeningen */
.prompt-kader{background:var(--wit);color:var(--blauw);border-radius:24px;border-left:10px solid var(--groen);padding:1rem 1.25rem;margin-bottom:.8rem}
.prompt-kader .pk-l{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:0 0 .3rem}
.prompt-kader .pk-t{font-weight:600;font-size:1.05rem;margin:0 0 .6rem}
.stappenlijst{background:var(--wit);color:var(--blauw);border-radius:24px;padding:1rem 1.25rem 1rem 2.6rem;margin:0 0 .8rem}
.stappenlijst li{margin:.35rem 0}
.tabel-kader{overflow-x:auto;margin-bottom:1rem;border-radius:20px}
.les-tabel{width:100%;border-collapse:collapse;background:var(--wit);color:var(--blauw)}
.les-tabel th{background:var(--groen);text-align:left;padding:.7rem .9rem;font-size:.9rem;text-transform:uppercase}
.les-tabel td{padding:.65rem .9rem;border-bottom:2px solid var(--grijs);vertical-align:top}
/* vaste navigatie */
.topnav{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;background:var(--blauw);padding:calc(env(safe-area-inset-top,0px) + .6rem) 0 .7rem;margin:0 0 1.2rem;border-bottom:2px solid rgba(255,255,255,.2)}
.nk{cursor:pointer;font:inherit;font-weight:700;font-size:.92rem;border-radius:999px;border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--wit);padding:.4rem .95rem}
.nk:hover{border-color:var(--groen);color:var(--groen)}
.nk.aan{background:var(--groen);border-color:var(--groen);color:var(--blauw)}
.nrol{margin-left:auto;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--groen)}
.kaart.intro h2{color:var(--blauw)}
/* presentatie: geen invulvelden voor de leerkracht, stellingen groot */
.pres textarea,.pres input[type=text],.pres .stl-btn{display:none!important}
.pres .stelling-card{border:8px solid #95D600!important;border-radius:32px!important;padding:1.4rem 1.7rem!important}
.pres .stelling-card,.pres .stelling-card *{font-size:clamp(1.4rem,2.6vw,2.3rem)!important;font-weight:800!important;line-height:1.25!important;color:#06038D!important}
.bordstelling{background:var(--wit);color:var(--blauw);border:8px solid var(--groen);border-radius:32px;padding:1.6rem 1.9rem;margin-bottom:1rem}
.bs-label{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:0 0 .4rem}
.bs-tekst{font-size:clamp(1.7rem,3.4vw,2.9rem);font-weight:800;line-height:1.2;margin:0 0 .7rem}
.bs-hulp{font-size:1.05em;margin:0;opacity:.85}
.bs-schaal{display:flex;justify-content:space-between;gap:1rem;margin-top:.4rem;padding:.6rem 1.2rem;border-radius:999px;background:linear-gradient(90deg,#06038D,#95D600);border:2px solid #FFFFFF}
.bs-schaal span{font-weight:800;color:#FFFFFF}
.bs-schaal span:last-child{color:#06038D}
.bordvragen{font-size:1.4em;font-weight:700;line-height:1.4;margin:0 0 .6rem}
.bordvragen li{margin:.4rem 0}
.kaart.groen .hoofd{background:var(--blauw);border-color:var(--blauw);color:var(--wit)}
.tweede{background:transparent;border-color:var(--wit);color:var(--wit);font-weight:700}
.kaart .tweede{border-color:var(--blauw);color:var(--blauw)}
.knoprij{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1rem}
.badge{display:inline-block;border-radius:999px;padding:.2rem .85rem;font-weight:800;font-size:.85rem;background:var(--groen);color:var(--blauw)}
.badge.wit{background:var(--wit)}
.badge.rand{background:transparent;border:2px solid var(--groen);color:var(--groen)}
.keuze{cursor:pointer;display:flex;align-items:center;gap:1rem;width:100%;text-align:left;background:var(--wit);color:var(--blauw);border:3px solid var(--wit);border-radius:24px;padding:1.1rem 1.25rem;font-weight:700;font-size:1.05rem}
.keuze:hover{border-color:var(--groen)}
.keuze small{display:block;font-weight:500;font-size:.9rem}
.keuze .icoon{flex:none;width:52px;height:52px}
input[type=text],textarea{width:100%;border:2px solid var(--blauw);border-radius:16px;padding:.7rem .9rem;color:var(--blauw);background:var(--wit)}
textarea{min-height:90px;resize:vertical}
.code-in{font-size:1.5rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.grote-code{font-size:clamp(2.2rem,8vw,3.8rem);font-weight:800;letter-spacing:.12em;text-align:center;margin:.4rem 0}
.voortgang{height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;margin:.5rem 0 1rem}
.voortgang i{display:block;height:100%;background:var(--groen);border-radius:999px;transition:width .3s}
.topbalk{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-bottom:.4rem}
.topbalk .stap{margin-left:auto;font-weight:600;font-size:.9rem;opacity:.9}
.mod{display:flex;align-items:flex-start;gap:.8rem;background:var(--wit);color:var(--blauw);border-radius:22px;padding:1rem 1.1rem;margin-bottom:.6rem;cursor:pointer;border:3px solid var(--wit)}
.mod.aan{border-color:var(--groen);background:var(--licht)}
.mod.uit{opacity:.55;cursor:not-allowed}
.mod input{width:22px;height:22px;accent-color:#06038D;flex:none;margin-top:.2rem}
.mod b{display:block}
.mod small{display:block;font-size:.88rem}
.klasmoment{background:var(--wit);color:var(--blauw);border:6px solid var(--groen);border-radius:28px;padding:1rem 1.25rem;margin-bottom:1rem}
.klasmoment .badge{margin-bottom:.4rem}
.lk{background:var(--blauw);color:var(--wit);border:3px dashed var(--groen);border-radius:24px;padding:1rem 1.2rem;margin:1rem 0}
.lk h3{color:var(--groen)}
details.lk>summary{cursor:pointer;list-style:none;color:var(--groen)}
details.lk>summary::-webkit-details-marker{display:none}
details.lk[open]>summary{margin-bottom:.6rem}
.lk ol,.lk ul{margin:.3rem 0;padding-left:1.2rem}
/* bouwer */
.bouw{display:grid;grid-template-columns:1fr;gap:.8rem}
.palet{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.kleur{width:40px;height:40px;border-radius:12px;border:3px solid var(--grijs);cursor:pointer}
.kleur.aan{border-color:var(--blauw);box-shadow:0 0 0 3px var(--groen)}
.maat{cursor:pointer;border-radius:999px;border:2px solid var(--blauw);background:var(--wit);color:var(--blauw);font-weight:700;padding:.35rem .9rem}
.maat.aan{background:var(--blauw);color:var(--wit)}
canvas.veld{width:100%;height:auto;border-radius:20px;border:2px solid var(--grijs);background:#F4F6FF;touch-action:manipulation;cursor:crosshair}
.gevoelens{display:flex;flex-wrap:wrap;gap:.45rem}
.gevoel{cursor:pointer;border-radius:999px;border:2px solid var(--blauw);background:var(--wit);color:var(--blauw);font-weight:600;padding:.35rem .9rem}
.gevoel.aan{background:var(--groen);border-color:var(--groen);font-weight:800}
/* labels */
.labels{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:.6rem 0}
.lab{border-radius:22px;padding:1rem;border:3px solid var(--blauw);background:var(--wit);color:var(--blauw)}
.lab .n{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;background:var(--blauw);color:var(--wit)}
.lab b{display:block;text-transform:uppercase;font-weight:800;margin:.4rem 0 .15rem}
.lab.l1{background:var(--blauw);color:var(--wit);border-color:var(--wit)}
.lab.l1 .n{background:var(--wit);color:var(--blauw)}
.lab.l3{border:6px solid var(--groen)}
.lab.l4{background:var(--groen);border-color:var(--groen)}
.vraag{background:var(--wit);color:var(--blauw);border-radius:22px;padding:1rem 1.15rem;margin-bottom:.7rem}
.vraag p.q{font-weight:700;margin:0 0 .6rem}
.opties{display:flex;flex-wrap:wrap;gap:.5rem}
.ko{cursor:pointer;border-radius:999px;border:2px solid var(--blauw);background:var(--wit);color:var(--blauw);font-weight:700;padding:.45rem 1rem}
.ko.goed{background:var(--groen);border-color:var(--groen)}
.ko.fout{background:var(--blauw);color:var(--wit)}
.ko:disabled{cursor:default}
.kfb{margin-top:.5rem;font-size:.95rem}
.kfb:empty{display:none}
.flip{cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:center;background:var(--wit);color:var(--blauw);border-radius:22px;padding:1rem;border:3px solid var(--wit);text-align:left;font-weight:700}
.flip.ai{background:var(--groen);border-color:var(--groen)}
.flip.regels{background:var(--blauw);color:var(--wit);border-color:var(--wit)}
.flip small{display:block;font-weight:500;margin-top:.3rem}
/* toren */
.torens{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;align-items:end}
.toren{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center}
.toren .stapel{display:flex;flex-direction:column-reverse;gap:3px;height:190px;justify-content:flex-start;width:100%;align-items:center}
.toren .blok{width:70%;height:28px;border-radius:7px;background:var(--groen);position:relative}
.toren .blok::before{content:"";position:absolute;top:-6px;left:20%;width:18%;height:7px;border-radius:4px 4px 0 0;background:inherit}
.toren .blok::after{content:"";position:absolute;top:-6px;right:20%;width:18%;height:7px;border-radius:4px 4px 0 0;background:inherit}
.toren .blok:nth-child(even){background:var(--mid)}
.toren .lbl{font-weight:700;font-size:.85rem;min-height:2.6em}
.toren .pm{display:flex;gap:.3rem}
.toren .pm button{cursor:pointer;width:36px;height:36px;border-radius:50%;border:2px solid var(--blauw);background:var(--wit);color:var(--blauw);font-weight:800;font-size:1.1rem}
/* overlay toon groot */
#groot{position:fixed;inset:0;z-index:50;background:var(--blauw);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 1.5rem) 1.5rem 1.5rem;text-align:center}
#groot.open{display:flex}
#groot img{max-width:min(92vw,1000px);max-height:62vh;border-radius:24px;background:#F4F6FF}
#groot h2{margin-top:1rem}
.voet{margin-top:2.5rem;display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.voet div{border:2px solid var(--wit);border-radius:20px;padding:.9rem 1.1rem}
.voet strong{display:block;color:var(--groen);text-transform:uppercase;font-weight:800}
.voet a{color:var(--groen);font-weight:700}
a.link{color:var(--blauw);font-weight:800}
.klein{font-size:.88rem}
#rapport{display:none}
@media (max-width:640px){.torens{grid-template-columns:repeat(3,1fr)}.chev{display:none}}
@media print{
  body{background:#fff;color:#06038D}
  .wrap > *:not(#rapport){display:none!important}
  #rapport{display:block!important}
  #rapport .kaart{border:2px solid #D9D9D9;break-inside:avoid}
  #rapport img{max-width:100%;border:1px solid #D9D9D9;border-radius:12px}
}
</style>
</head>
<body>

function siteStappen(n){

  return lijst.map(function(fn,i){
    var naam=fn.name, bron=String(fn);
    var klas=/disc-card|renderStellingenLeerling|charter/.test(bron);
    return {type:'site',fn:naam,id:'s'+n+'_'+naam,titel:'',klas:klas,lk:klas?LK_ALG:null};
  });
}

  [1,2,3,4,5,6,7].forEach(function(n){

      uit.push(s);(plan[s.fn]||[]).forEach(function(id){uit.push(CE_STAP[id]);geplaatst[id]=1;});
    });
    Object.keys(plan).forEach(function(k){plan[k].forEach(function(id){if(!geplaatst[id])uit.push(CE_STAP[id]);});});

    if(n===6){var k=uit.findIndex(function(s){return s.fn==='m6s_gevolgen';});uit.splice(k>=0?k+1:uit.length,0,STAD);}
    STAPPEN[M]=uit.concat([rap(n)]);
  });

var KLAS={};
function bouwKlas(){
  Object.keys(KLASPLAN).forEach(function(M){
    var pool={};[OPENING,LABELSTAP,STAD,K6_START].concat(LES[M]||[]).forEach(function(s){pool[s.id]=s;});
    var plan=KLASPLAN[M],basis=STAPPEN[M].filter(function(s){return s.type!=='rapport';}),uit=[];
    var neem=function(ids){(ids||[]).forEach(function(id){if(pool[id])uit.push(pool[id]);});};
    uit.push(titelDia(MODULES.filter(function(x){return x.id===M;})[0]));
    neem(plan.start);
    basis.forEach(function(s){if(s===OPENING||s===LABELSTAP)return;uit.push(s);if(s.fn)neem(plan[s.fn]);});
    neem(plan.eind);
    uit.push({type:'rapport',id:'k'+M.slice(1)+'_rapport',titel:'Einde van de module'});
    KLAS[M]=uit;
  });
}

 ce4_risicos:{type:'info',id:'ce4_risicos',titel:'Drie risico\u2019s die je niet meteen ziet',html:

var RENDER={};
var KLEUREN=['#06038D','#95D600','#CCFF99','#A6F04A','#FFFFFF','#D9D9D9','#3A37B5'];
var COLS=16,ROWS=11,CEL=40;

RENDER.bouw=function(el,stap){
  var data=antwoord(stap.id)||{blokken:[],titel:'',gevoel:''};
  var kleur=0,maat=2,gum=false,historie=[];
  el.innerHTML='<div class="kaart"><h3>'+esc(stap.vraag)+'</h3><p>'+esc(stap.uitleg)+'</p></div>'+
   '<div class="kaart bouw"><div class="palet" id="pal"></div>'+

   '<button class="maat" id="gum">Gom</button><button class="maat" id="undo">↶ Terug</button><button class="maat" id="leeg">Leegmaken</button></div>'+
   '<canvas class="veld" id="veld" width="'+(COLS*CEL)+'" height="'+(ROWS*CEL)+'" aria-label="Bouwveld: klik om een blokje te plaatsen"></canvas>'+
   '<p class="klein">Klik in een kolom: het blokje valt naar beneden. Met de gom klik je een blokje weg.</p></div>'+
   '<div class="kaart"><h3>Geef je bouwwerk een titel</h3><input type="text" id="bt" maxlength="60" placeholder="bv. Een brug met een gat erin"><h3 style="margin-top:.9rem">Welk gevoel past erbij?</h3><div class="gevoelens" id="gv"></div>'+
   '<div class="knoprij"><button class="hoofd" id="groot-knop">Toon groot (voor het bord)</button></div></div>';
  var pal=el.querySelector('#pal');
  pal.innerHTML='<span class="klein"><b>Kleur</b></span>'+KLEUREN.map(function(k,i){return '<button class="kleur" data-k="'+i+'" style="background:'+k+'" aria-label="Kleur '+(i+1)+'"></button>';}).join('');
  var cv=el.querySelector('#veld'),cx=cv.getContext('2d');
  function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
  function teken(){
    cx.fillStyle='#F4F6FF';cx.fillRect(0,0,cv.width,cv.height);
    cx.fillStyle='#E1E5F7';for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){cx.beginPath();cx.arc(c*CEL+CEL/2,r*CEL+CEL/2,2.2,0,7);cx.fill();}
    data.blokken.forEach(function(b){

      '<div class="palet" style="margin-top:.5rem"><button class="maat" id="rt">⟳ Draai stuk</button><button class="maat" id="gm">Gom</button><button class="maat" id="un">↶ Terug</button><button class="maat" id="lg">Leegmaken</button><span class="klein" style="margin-left:auto">Zicht:</span><button class="maat" id="zl">◀</button><button class="maat" id="zr">▶</button><button class="maat" id="zi">+</button><button class="maat" id="zo">−</button></div>'+

  if(S.rol==='lk')h='<div class="kaart twijfel"><p><b>Leerlingen bouwen op hun laptop:</b> open de cursus · Ik ben leerling · '+esc((S.mods[S.mi]||{}).titel||'')+' · '+esc(stap.titel)+'. Jij kan hier zelf iets voorbouwen. Laat daarna enkele leerlingen hun bouwwerk tonen.</p></div>'+h;
  el.innerHTML=h;
  var bt=el.querySelector('#bt');bt.value=data.titel||'';bt.oninput=function(){data.titel=bt.value;bewaar();};
  var gv=el.querySelector('#gv');

  function bewaar(){antwoord(stap.id,data);}
  stap.melding='Bouw minstens 3 stukken, geef een titel en kies een gevoel.';
  if(typeof THREE==='undefined'){stap.verplicht=function(){var d=antwoord(stap.id)||{};return d.titel&&d.gevoel;};return;}

  var vw=el.querySelector('#vw'),kl=el.querySelector('#kl');
  vw.innerHTML='<span class="klein"><b>Stuk</b></span>'+stap.voorwerpen.map(function(k){return '<button class="maat" data-v="'+k+'">'+VOORWERPEN[k].naam+'</button>';}).join('');
  kl.innerHTML='<span class="klein"><b>Kleur blokjes</b></span>'+KLEUR3D.map(function(k,i){return '<button class="kleur" data-k="'+i+'" style="background:'+k+'" aria-label="Kleur '+(i+1)+'"></button>';}).join('');
  var box=el.querySelector('#drie');
  var renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.setClearColor('#EEF1FF');box.appendChild(renderer.domElement);renderer.domElement.style.display='block';renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';
  var scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#FFFFFF','#B8BCE0',.85));var dl=new THREE.DirectionalLight('#FFFFFF',.55);dl.position.set(6,12,8);scene.add(dl);
  var plaat=new THREE.Group();var pm=new THREE.Mesh(new THREE.BoxGeometry(N,.3,N),mat('#CCFF99'));pm.position.y=-.15;plaat.add(pm);
  for(var i=0;i<N;i++)for(var j=0;j<N;j++){var s=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.14,12),mat('#B9EE7A'));s.position.set(i-N/2+.5,.07,j-N/2+.5);plaat.add(s);}
  scene.add(plaat);
  var cam=new THREE.PerspectiveCamera(40,4/3,.1,200);var th=.75,ph=.95,rad=N*1.65;
  function zet(){cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,1,0);teken();}
  var spook=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:'#06038D',transparent:true,opacity:.18,depthWrite:false}));spook.visible=false;scene.add(spook);
  var groep=new THREE.Group();scene.add(groep);
  function voet(it){var v=VOORWERPEN[it.k],r=it.r%2;return {w:r?v.d:v.w,d:r?v.w:v.d};}
  function hoogte(i0,j0,w,d,uit){var y=0;data.items.forEach(function(it){if(it===uit)return;var f=voet(it);if(i0<it.i+f.w&&i0+w>it.i&&j0<it.j+f.d&&j0+d>it.j)y=Math.max(y,it.y+VOORWERPEN[it.k].h);});return y;}
  function bouwScene(){while(groep.children.length)groep.remove(groep.children[0]);
    data.items.forEach(function(it,idx){var v=VOORWERPEN[it.k];if(!v)return;var o=v.bord?bordje(v.bord):(v.kleur?v.maak(KLEUR3D[it.c||0]):v.maak());var f=voet(it);
      o.position.set(it.i+f.w/2-N/2,it.y,it.j+f.d/2-N/2);o.rotation.y=it.r*Math.PI/2;o.traverse(function(m){m.userData.idx=idx;});groep.add(o);});teken();}
  function teken(){renderer.render(scene,cam);}
  function maat(){var w=box.clientWidth,hh=box.clientHeight||w*.75;renderer.setSize(w,hh,false);cam.aspect=w/hh;cam.updateProjectionMatrix();teken();}
  var ray=new THREE.Raycaster(),mv=new THREE.Vector2();
  function treffer(e){var r=renderer.domElement.getBoundingClientRect();mv.x=((e.clientX-r.left)/r.width)*2-1;mv.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mv,cam);
    var t=ray.intersectObjects(groep.children.concat([pm]),true);return t[0]||null;}
  function plek(hit){var v=VOORWERPEN[sel],r=rot%2,w=r?v.d:v.w,d=r?v.w:v.d;var p=hit.point.clone();
    if(hit.object!==pm&&hit.face){var nrm=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);p.add(nrm.multiplyScalar(.3));}
    var ci=Math.floor(p.x+N/2),cj=Math.floor(p.z+N/2);var i0=Math.max(0,Math.min(N-w,ci-Math.floor((w-1)/2))),j0=Math.max(0,Math.min(N-d,cj-Math.floor((d-1)/2)));
    return {i:i0,j:j0,w:w,d:d,y:hoogte(i0,j0,w,d),h:v.h};}
  var neer=null,sleep=false;
  renderer.domElement.addEventListener('pointerdown',function(e){neer={x:e.clientX,y:e.clientY,th:th,ph:ph};sleep=false;renderer.domElement.setPointerCapture(e.pointerId);});
  renderer.domElement.addEventListener('pointermove',function(e){
    if(neer){var dx=e.clientX-neer.x,dy=e.clientY-neer.y;if(Math.abs(dx)+Math.abs(dy)>6)sleep=true;if(sleep){th=neer.th-dx*.01;ph=Math.max(.25,Math.min(1.45,neer.ph-dy*.01));spook.visible=false;zet();}return;}
    var hit=treffer(e);if(!hit||gum){spook.visible=false;teken();return;}var p=plek(hit);
    spook.scale.set(p.w,p.h,p.d);spook.position.set(p.i+p.w/2-N/2,p.y+p.h/2,p.j+p.d/2-N/2);spook.visible=true;teken();});
  renderer.domElement.addEventListener('pointerleave',function(){spook.visible=false;teken();});
  var historie=[];
  renderer.domElement.addEventListener('pointerup',function(e){var was=sleep;neer=null;if(was)return;var hit=treffer(e);if(!hit)return;
    if(gum){if(hit.object===pm)return;var idx=hit.object.userData.idx;if(idx===undefined)return;historie.push(JSON.stringify(data.items));data.items.splice(idx,1);}
    else{var p=plek(hit);if(p.y>12)return;historie.push(JSON.stringify(data.items));data.items.push({k:sel,i:p.i,j:p.j,r:rot,c:kleur,y:p.y});}
    spook.visible=false;bouwScene();bewaar();});
  renderer.domElement.addEventListener('wheel',function(e){e.preventDefault();rad=Math.max(N*.8,Math.min(N*3,rad+(e.deltaY>0?1:-1)));zet();},{passive:false});
  function knoppen(){vw.querySelectorAll('.maat').forEach(function(b){b.classList.toggle('aan',b.dataset.v===sel&&!gum);});kl.querySelectorAll('.kleur').forEach(function(b){b.classList.toggle('aan',+b.dataset.k===kleur);});el.querySelector('#gm').classList.toggle('aan',gum);kl.style.opacity=VOORWERPEN[sel].kleur?1:.4;}
  vw.querySelectorAll('.maat').forEach(function(b){b.onclick=function(){sel=b.dataset.v;gum=false;knoppen();};});
  kl.querySelectorAll('.kleur').forEach(function(b){b.onclick=function(){kleur=+b.dataset.k;gum=false;knoppen();};});
  el.querySelector('#rt').onclick=function(){rot=(rot+1)%4;};
  el.querySelector('#gm').onclick=function(){gum=!gum;knoppen();};

  el.querySelector('#zl').onclick=function(){th-=.4;zet();};el.querySelector('#zr').onclick=function(){th+=.4;zet();};
  el.querySelector('#zi').onclick=function(){rad=Math.max(N*.8,rad-2);zet();};el.querySelector('#zo').onclick=function(){rad=Math.min(N*3,rad+2);zet();};

  el.querySelector('#groot-knop').onclick=function(){data.img=foto();bewaar();toonGroot(data.img,data.titel,data.gevoel);};

  if(window.ResizeObserver){new ResizeObserver(maat).observe(box);}window.addEventListener('resize',maat);
  knoppen();maat();zet();bouwScene();
  stap.verplicht=function(){if(data.items.length){data.img=foto();bewaar();}return data.items.length>=3&&data.titel&&data.gevoel;};
  stap.bijVerlaten=function(){if(data.items.length){data.img=foto();bewaar();}};
};
